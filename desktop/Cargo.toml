[workspace]
members = ["crates/ynab-core", "crates/ynab-desktop"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["YNABx"]
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dioxus = { version = "0.7.10", features = ["desktop", "router"] }
rfd = "0.15"
dirs = "5.0"
base64 = "0.22"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
