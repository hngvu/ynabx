<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Diagonal stripe pattern for spent funded -->
    <pattern id="stripes-green" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#aee865" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#77ba21" stroke-width="3" opacity="0.45" />
    </pattern>
    <!-- Diagonal stripe pattern for spent underfunded -->
    <pattern id="stripes-yellow" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fbe48e" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e5b200" stroke-width="3" opacity="0.45" />
    </pattern>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect x="4" y="4" width="852" height="462" rx="10" fill="#ffffff" stroke="#d2d8de" stroke-width="1" filter="url(#card-shadow)" />

  <!-- Top Header Bar -->
  <path d="M 5 14 Q 5 5 14 5 L 846 5 Q 855 5 855 14 L 855 72 L 5 72 Z" fill="#ffffff" />
  <line x1="5" y1="72" x2="855" y2="72" stroke="#e2e8f0" stroke-width="1" />

  <!-- Month Selector -->
  <circle cx="34" cy="38" r="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <path d="M 36 33 L 31 38 L 36 43" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="58" y="44" font-size="18" font-weight="800" fill="#191818">OCT 2026</text>
  <path d="M 152 36 L 156 41 L 160 36" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <circle cx="182" cy="38" r="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <path d="M 180 33 L 185 38 L 180 43" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ready to Assign Banner ($0.00 All Money Assigned) -->
  <rect x="290" y="13" width="280" height="50" rx="8" fill="#f3eee2" stroke="#e4decb" stroke-width="1" />
  <text x="430" y="35" font-size="18" font-weight="800" fill="#696763" text-anchor="middle">$0.00</text>
  <text x="430" y="53" font-size="11.5" font-weight="600" fill="#696763" text-anchor="middle">All Money Assigned</text>

  <!-- Column Headers -->
  <rect x="5" y="73" width="850" height="32" fill="#f8fafc" />
  <line x1="5" y1="105" x2="855" y2="105" stroke="#d2d8de" stroke-width="1" />
  <text x="24" y="93" font-size="11" font-weight="700" fill="#6e7a88" letter-spacing="0.05em">CATEGORY</text>
  <text x="560" y="93" font-size="11" font-weight="700" fill="#6e7a88" text-anchor="end" letter-spacing="0.05em">ASSIGNED</text>
  <text x="695" y="93" font-size="11" font-weight="700" fill="#6e7a88" text-anchor="end" letter-spacing="0.05em">ACTIVITY</text>
  <text x="836" y="93" font-size="11" font-weight="700" fill="#6e7a88" text-anchor="end" letter-spacing="0.05em">AVAILABLE</text>

  <!-- GROUP 1: Immediate Obligations -->
  <rect x="5" y="106" width="850" height="32" fill="#f4f6f8" />
  <line x1="5" y1="138" x2="855" y2="138" stroke="#e2e8f0" stroke-width="1" />
  <path d="M 20 119 L 25 125 L 30 119" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <text x="38" y="126" font-size="13" font-weight="700" fill="#191818">Immediate Obligations</text>
  <text x="560" y="126" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$1,760.00</text>
  <text x="695" y="126" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">-$1,325.40</text>
  <text x="836" y="126" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$434.60</text>

  <!-- Row 1.1: Rent / Mortgage (Fully Spent -> Gray Pill) -->
  <rect x="5" y="139" width="850" height="48" fill="#ffffff" />
  <line x1="5" y1="187" x2="855" y2="187" stroke="#f1f5f9" stroke-width="1" />
  <text x="38" y="160" font-size="13.5" font-weight="500" fill="#191818">Rent / Mortgage</text>
  <text x="455" y="160" font-size="11.5" font-weight="600" fill="#6e7a88" text-anchor="end">Fully Spent. Spent $1,200.00 of $1,200.00</text>
  <!-- Progress Bar: 100% striped green -->
  <rect x="38" y="169" width="417" height="5" rx="2.5" fill="url(#stripes-green)" />
  <text x="560" y="166" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">$1,200.00</text>
  <text x="695" y="166" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">-$1,200.00</text>
  <!-- Gray Pill -->
  <rect x="768" y="150" width="70" height="23" rx="11.5" fill="#f3eee2" />
  <circle cx="781" cy="161.5" r="6" fill="#696763" />
  <path d="M 778.5 161.5 L 780.3 163.5 L 784 159.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <text x="830" y="166" font-size="13" font-weight="700" fill="#696763" text-anchor="end">$0.00</text>

  <!-- Row 1.2: Groceries (Funded & Partially Spent -> Green Pill) -->
  <rect x="5" y="188" width="850" height="48" fill="#ffffff" />
  <line x1="5" y1="236" x2="855" y2="236" stroke="#f1f5f9" stroke-width="1" />
  <text x="38" y="209" font-size="13.5" font-weight="500" fill="#191818">Groceries</text>
  <text x="455" y="209" font-size="11.5" font-weight="600" fill="#029864" text-anchor="end">Funded. Spent $125.40 of $450.00</text>
  <!-- Progress Bar: 28% striped green + 72% solid green -->
  <rect x="38" y="218" width="417" height="5" rx="2.5" fill="#77ba21" />
  <rect x="38" y="218" width="116" height="5" rx="2.5" fill="url(#stripes-green)" />
  <text x="560" y="215" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">$450.00</text>
  <text x="695" y="215" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">-$125.40</text>
  <!-- Green Pill -->
  <rect x="752" y="199" width="86" height="23" rx="11.5" fill="#aee865" />
  <circle cx="765" cy="210.5" r="6" fill="#191818" />
  <path d="M 762.5 210.5 L 764.3 212.5 L 768 208.5" fill="none" stroke="#aee865" stroke-width="1.5" stroke-linecap="round" />
  <text x="830" y="215" font-size="13" font-weight="700" fill="#191818" text-anchor="end">$324.60</text>

  <!-- Row 1.3: Electric & Water (Funded Unspent -> Green Pill) -->
  <rect x="5" y="237" width="850" height="48" fill="#ffffff" />
  <line x1="5" y1="285" x2="855" y2="285" stroke="#e2e8f0" stroke-width="1" />
  <text x="38" y="258" font-size="13.5" font-weight="500" fill="#191818">Electric &amp; Water</text>
  <text x="455" y="258" font-size="11.5" font-weight="600" fill="#029864" text-anchor="end">Funded</text>
  <rect x="38" y="267" width="417" height="5" rx="2.5" fill="#77ba21" />
  <text x="560" y="264" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">$110.00</text>
  <text x="695" y="264" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="end">$0.00</text>
  <rect x="752" y="248" width="86" height="23" rx="11.5" fill="#aee865" />
  <circle cx="765" cy="259.5" r="6" fill="#191818" />
  <path d="M 762.5 259.5 L 764.3 261.5 L 768 257.5" fill="none" stroke="#aee865" stroke-width="1.5" stroke-linecap="round" />
  <text x="830" y="264" font-size="13" font-weight="700" fill="#191818" text-anchor="end">$110.00</text>

  <!-- GROUP 2: True Expenses -->
  <rect x="5" y="286" width="850" height="32" fill="#f4f6f8" />
  <line x1="5" y1="318" x2="855" y2="318" stroke="#e2e8f0" stroke-width="1" />
  <path d="M 20 299 L 25 305 L 30 299" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <text x="38" y="306" font-size="13" font-weight="700" fill="#191818">True Expenses</text>
  <text x="560" y="306" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$135.00</text>
  <text x="695" y="306" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$0.00</text>
  <text x="836" y="306" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$405.00</text>

  <!-- Row 2.1: Auto Insurance (2-section Rollover + Funded) -->
  <rect x="5" y="319" width="850" height="48" fill="#ffffff" />
  <line x1="5" y1="367" x2="855" y2="367" stroke="#f1f5f9" stroke-width="1" />
  <text x="38" y="340" font-size="13.5" font-weight="500" fill="#191818">Auto Insurance</text>
  <text x="455" y="340" font-size="11.5" font-weight="600" fill="#029864" text-anchor="end">Funded</text>
  <!-- 2 segments: prior rollover + current month -->
  <rect x="38" y="349" width="270" height="5" rx="2.5" fill="#77ba21" />
  <rect x="313" y="349" width="142" height="5" rx="2.5" fill="#77ba21" />
  <text x="560" y="346" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">$85.00</text>
  <text x="695" y="346" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="end">$0.00</text>
  <rect x="752" y="330" width="86" height="23" rx="11.5" fill="#aee865" />
  <circle cx="765" cy="341.5" r="6" fill="#191818" />
  <path d="M 762.5 341.5 L 764.3 343.5 L 768 339.5" fill="none" stroke="#aee865" stroke-width="1.5" stroke-linecap="round" />
  <text x="830" y="346" font-size="13" font-weight="700" fill="#191818" text-anchor="end">$255.00</text>

  <!-- GROUP 3: Credit Card Payments -->
  <rect x="5" y="368" width="850" height="32" fill="#f4f6f8" />
  <line x1="5" y1="400" x2="855" y2="400" stroke="#e2e8f0" stroke-width="1" />
  <path d="M 20 381 L 25 387 L 30 381" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" />
  <text x="38" y="388" font-size="13" font-weight="700" fill="#191818">Credit Card Payments</text>
  <text x="560" y="388" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$0.00</text>
  <text x="695" y="388" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">+$125.40</text>
  <text x="836" y="388" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">$125.40</text>

  <!-- Row 3.1: Chase Sapphire Visa -->
  <path d="M 5 401 L 855 401 L 855 456 Q 855 465 846 465 L 14 465 Q 5 465 5 456 Z" fill="#ffffff" />
  <text x="38" y="425" font-size="13.5" font-weight="500" fill="#191818">💳 Chase Sapphire Visa</text>
  <rect x="38" y="435" width="417" height="5" rx="2.5" fill="#77ba21" />
  <text x="560" y="431" font-size="13.5" font-weight="500" fill="#191818" text-anchor="end">$0.00</text>
  <text x="695" y="431" font-size="13.5" font-weight="500" fill="#029864" text-anchor="end">+$125.40</text>
  <rect x="752" y="415" width="86" height="23" rx="11.5" fill="#aee865" />
  <text x="830" y="431" font-size="13" font-weight="700" fill="#191818" text-anchor="end">$125.40</text>
</svg>
