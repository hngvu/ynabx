<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 286" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="r-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect x="4" y="4" width="852" height="278" rx="10" fill="#ffffff" stroke="#d2d8de" stroke-width="1" filter="url(#r-shadow)" />

  <!-- Top Register Header: Account Name + 3 Balances + Reconcile Button -->
  <path d="M 5 14 Q 5 5 14 5 L 846 5 Q 855 5 855 14 L 855 68 L 5 68 Z" fill="#ffffff" />
  <line x1="5" y1="68" x2="855" y2="68" stroke="#e2e8f0" stroke-width="1" />

  <text x="24" y="34" font-size="16" font-weight="800" fill="#191818">Chase Checking</text>
  <text x="24" y="52" font-size="11.5" font-weight="500" fill="#6e7a88">On-Plan Cash Account · Last Reconciled Oct 15, 2026</text>

  <!-- Cleared + Uncleared = Working Balance -->
  <text x="370" y="33" font-size="14" font-weight="700" fill="#029864" text-anchor="middle">$1,425.50</text>
  <text x="370" y="50" font-size="10.5" font-weight="600" fill="#6e7a88" text-anchor="middle">Cleared Balance</text>

  <text x="438" y="35" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">+</text>

  <text x="505" y="33" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">-$30.00</text>
  <text x="505" y="50" font-size="10.5" font-weight="600" fill="#6e7a88" text-anchor="middle">Uncleared Balance</text>

  <text x="572" y="35" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">=</text>

  <text x="642" y="33" font-size="14" font-weight="800" fill="#029864" text-anchor="middle">$1,395.50</text>
  <text x="642" y="50" font-size="10.5" font-weight="600" fill="#6e7a88" text-anchor="middle">Working Balance</text>

  <!-- Reconcile Button -->
  <rect x="742" y="20" width="94" height="32" rx="6" fill="#545bfe" />
  <text x="789" y="40" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reconcile</text>

  <!-- Table Column Headers -->
  <rect x="5" y="69" width="850" height="30" fill="#f8fafc" />
  <line x1="5" y1="99" x2="855" y2="99" stroke="#d2d8de" stroke-width="1" />
  <text x="55" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">INFO</text>
  <text x="95" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">FLAG</text>
  <text x="140" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">DATE</text>
  <text x="235" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">PAYEE</text>
  <text x="395" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">CATEGORY</text>
  <text x="530" y="88" font-size="10.5" font-weight="700" fill="#6e7a88">MEMO</text>
  <text x="705" y="88" font-size="10.5" font-weight="700" fill="#6e7a88" text-anchor="end">OUTFLOW</text>
  <text x="785" y="88" font-size="10.5" font-weight="700" fill="#6e7a88" text-anchor="end">INFLOW</text>
  <circle cx="825" cy="84" r="6" fill="#6e7a88" />
  <text x="825" y="87.5" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>

  <!-- ROW 1: Unapproved + Auto-Matched Import (approved=false, CLEARED) -->
  <rect x="5" y="100" width="850" height="44" fill="#eff6ff" />
  <line x1="5" y1="144" x2="855" y2="144" stroke="#dbeafe" stroke-width="1" />
  <rect x="20" y="114" width="14" height="14" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <!-- Blue Info / Needs Approval + Link Icon -->
  <circle cx="57" cy="121" r="7" fill="#2563eb" />
  <text x="57" y="125" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">i</text>
  <text x="73" y="125" font-size="11" fill="#2563eb" font-weight="700">🔗</text>
  <!-- Blue Flag -->
  <path d="M 98 114 L 114 114 L 110 120 L 114 126 L 98 126 Z" fill="#3b82f6" />
  <line x1="98" y1="114" x2="98" y2="130" stroke="#3b82f6" stroke-width="1.8" />
  <text x="140" y="126" font-size="12.5" font-weight="600" fill="#191818">2026-10-30</text>
  <text x="235" y="126" font-size="12.5" font-weight="600" fill="#191818">Trader Joe's</text>
  <text x="395" y="126" font-size="12.5" font-weight="600" fill="#191818">Groceries</text>
  <text x="530" y="126" font-size="12" font-weight="600" fill="#2563eb">Matched (±10d) · Needs Approval</text>
  <text x="705" y="126" font-size="12.5" font-weight="700" fill="#191818" text-anchor="end">$45.20</text>
  <!-- Cleared C Circle -->
  <circle cx="825" cy="121" r="8" fill="#16a34a" />
  <text x="825" y="125" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>

  <!-- ROW 2: Manual Uncleared Entry (approved=true, UNCLEARED) -->
  <rect x="5" y="145" width="850" height="44" fill="#ffffff" />
  <line x1="5" y1="189" x2="855" y2="189" stroke="#f1f5f9" stroke-width="1" />
  <rect x="20" y="159" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Yellow Flag -->
  <path d="M 98 159 L 114 159 L 110 165 L 114 171 L 98 171 Z" fill="#eab308" />
  <line x1="98" y1="159" x2="98" y2="175" stroke="#eab308" stroke-width="1.8" />
  <text x="140" y="171" font-size="12.5" font-weight="500" fill="#191818">2026-10-29</text>
  <text x="235" y="171" font-size="12.5" font-weight="500" fill="#191818">Shell Station</text>
  <text x="395" y="171" font-size="12.5" font-weight="500" fill="#191818">Gas &amp; Fuel</text>
  <text x="530" y="171" font-size="12" font-weight="400" fill="#64748b">Uncleared (in register, affects Available now)</text>
  <text x="705" y="171" font-size="12.5" font-weight="500" fill="#191818" text-anchor="end">$30.00</text>
  <!-- Uncleared Hollow Circle -->
  <circle cx="825" cy="166" r="8" fill="none" stroke="#94a3b8" stroke-width="1.6" />
  <text x="825" y="170" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">C</text>

  <!-- ROW 3: Cleared Income (approved=true, CLEARED) -->
  <rect x="5" y="190" width="850" height="44" fill="#ffffff" />
  <line x1="5" y1="234" x2="855" y2="234" stroke="#f1f5f9" stroke-width="1" />
  <rect x="20" y="204" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Green Flag -->
  <path d="M 98 204 L 114 204 L 110 210 L 114 216 L 98 216 Z" fill="#22c55e" />
  <line x1="98" y1="204" x2="98" y2="220" stroke="#22c55e" stroke-width="1.8" />
  <text x="140" y="216" font-size="12.5" font-weight="500" fill="#191818">2026-10-25</text>
  <text x="235" y="216" font-size="12.5" font-weight="500" fill="#191818">Acme Corp Payroll</text>
  <text x="395" y="216" font-size="12.5" font-weight="600" fill="#029864">Inflow: Ready to Assign</text>
  <text x="530" y="216" font-size="12" font-weight="400" fill="#64748b">October Paycheck #2</text>
  <text x="785" y="216" font-size="12.5" font-weight="600" fill="#029864" text-anchor="end">$2,670.70</text>
  <!-- Cleared C Circle -->
  <circle cx="825" cy="211" r="8" fill="#16a34a" />
  <text x="825" y="215" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>

  <!-- ROW 4: Reconciled Transaction (RECONCILED padlock) -->
  <path d="M 5 235 L 855 235 L 855 272 Q 855 281 846 281 L 14 281 Q 5 281 5 272 Z" fill="#f8fafc" />
  <rect x="20" y="249" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Purple Flag -->
  <path d="M 98 249 L 114 249 L 110 255 L 114 261 L 98 261 Z" fill="#a855f7" />
  <line x1="98" y1="249" x2="98" y2="265" stroke="#a855f7" stroke-width="1.8" />
  <text x="140" y="261" font-size="12.5" font-weight="500" fill="#475569">2026-10-15</text>
  <text x="235" y="261" font-size="12.5" font-weight="500" fill="#475569">Pacific Gas &amp; Electric</text>
  <text x="395" y="261" font-size="12.5" font-weight="500" fill="#475569">Electric &amp; Water</text>
  <text x="530" y="261" font-size="12" font-weight="400" fill="#64748b">Reconciled against Oct 15 bank statement</text>
  <text x="705" y="261" font-size="12.5" font-weight="500" fill="#475569" text-anchor="end">$110.00</text>
  <!-- Green Padlock Icon -->
  <rect x="819" y="255" width="12" height="9" rx="2" fill="#16a34a" />
  <path d="M 821.5 255 L 821.5 252 A 3.5 3.5 0 0 1 828.5 252 L 828.5 255" fill="none" stroke="#16a34a" stroke-width="1.8" />
</svg>
