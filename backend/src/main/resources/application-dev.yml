spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ynabx}
    username: ${SPRING_DATASOURCE_USERNAME:ynabx}
    password: ${SPRING_DATASOURCE_PASSWORD:ynabx_dev_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ynabx: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
